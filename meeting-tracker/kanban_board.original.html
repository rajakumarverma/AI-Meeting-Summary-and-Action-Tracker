<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Board</title>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f1f1f0;
  --color-background-tertiary: #f4f4f4;
  --color-text-primary: #1f1f1e;
  --color-text-secondary: #6b6b68;
  --color-border-secondary: #cfcfcb;
  --color-border-tertiary: #e2e2de;
  --border-radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary: #26262a;
    --color-background-secondary: #34343a;
    --color-background-tertiary: #1a1a1d;
    --color-text-primary: #ececec;
    --color-text-secondary: #a0a0a6;
    --color-border-secondary: #4a4a52;
    --color-border-tertiary: #3a3a42;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background: var(--color-background-tertiary); color: var(--color-text-primary); }
.board { min-height: 100vh; padding: 20px 16px; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 520px) { .grid { grid-template-columns: minmax(0,1fr); } }
.col { background: var(--color-background-primary); border-radius: var(--border-radius-lg); border: 2px solid transparent; padding: 14px 12px; transition: all .15s; }
.col.over { background: #e8f0fe; border: 2px dashed #4a86e8; }
@media (prefers-color-scheme: dark) { .col.over { background: #22304a; } }
.col-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.col-label { font-weight: 500; font-size: 14px; }
.col-count { font-size: 12px; background: var(--color-background-secondary); color: var(--color-text-secondary); border-radius: 20px; padding: 1px 8px; font-weight: 500; }
.cards { display: flex; flex-direction: column; gap: 8px; min-height: 8px; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: 9px; padding: 11px 11px 10px 12px; cursor: grab; user-select: none; transition: opacity .15s; box-shadow: 0 0 0 0.5px var(--color-border-tertiary); }
.card.dragging { opacity: 0.4; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; margin-bottom: 9px; }
.card-title { font-size: 13px; font-weight: 500; line-height: 1.45; flex: 1; word-break: break-word; }
.card-bottom { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.avatar { width: 26px; height: 26px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; border: 2px solid var(--color-background-primary); }
.avatar-empty { background: var(--color-background-secondary); font-size: 13px; color: var(--color-text-secondary); }
.assignee-name { font-size: 11px; color: var(--color-text-secondary); margin-top: 6px; }
.menu-wrap { position: relative; }
.menu-btn { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); font-size: 16px; line-height: 1; padding: 0 3px; border-radius: 4px; letter-spacing: 1px; }
.menu-btn:hover { color: var(--color-text-primary); }
.dropdown { position: absolute; right: 0; top: 110%; background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 200; min-width: 130px; overflow: hidden; }
.drop-btn { display: block; width: 100%; padding: 9px 14px; background: none; border: none; text-align: left; font-size: 13px; cursor: pointer; }
.drop-btn:hover { background: var(--color-background-secondary); }
.add-btn { width: 100%; display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--color-text-secondary); font-size: 13px; cursor: pointer; padding: 6px 4px; border-radius: 6px; text-align: left; margin-top: 10px; }
.add-btn:hover { background: var(--color-background-secondary); }
.form { background: var(--color-background-primary); border: 0.5px solid var(--color-border-secondary); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
.form input { border: 0.5px solid var(--color-border-secondary); border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none; color: var(--color-text-primary); background: var(--color-background-primary); width: 100%; }
.form input:focus { border-color: #4a86e8; }
.form-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 5px; font-weight: 500; letter-spacing: .3px; }
.prio-btns { display: flex; gap: 6px; }
.prio-btn { flex: 1; font-size: 12px; padding: 5px 4px; border-radius: 6px; border: 1.5px solid var(--color-border-secondary); background: var(--color-background-secondary); color: var(--color-text-secondary); cursor: pointer; transition: all .1s; }
.form-actions { display: flex; gap: 6px; }
.save-btn { font-size: 12px; padding: 6px 14px; background: #4a86e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
.cancel-btn { font-size: 12px; padding: 6px 10px; background: none; color: var(--color-text-secondary); border: none; border-radius: 6px; cursor: pointer; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; z-index: 300; }
.modal { background: var(--color-background-primary); border-radius: 14px; padding: 24px; width: 360px; max-width: 92vw; }
.modal-title { font-size: 15px; font-weight: 500; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="board">
  <div class="grid" id="board"></div>
  <div id="modal-root"></div>
</div>

<script>
const COLUMNS = [{id:"open",label:"Open"},{id:"inprogress",label:"In Progress"},{id:"hold",label:"Hold"},{id:"completed",label:"Completed"}];
const PRIORITIES = ["Low","Medium","High"];
const PSTYLE = {
  Low:{bg:"#E8F5E9",color:"#2E7D32",dot:"#43A047"},
  Medium:{bg:"#FFF8E1",color:"#F57F17",dot:"#FFB300"},
  High:{bg:"#FDECEA",color:"#C62828",dot:"#E53935"}
};
const AVCOLORS = ["#4a86e8","#e87c4a","#4ac9a8","#a04ae8","#e84a7e","#4ae860","#e8c94a"];
const STORAGE_KEY = "kanban_v3";

function genId(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatarInitials(n){if(!n)return"?";return n.trim().split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()}
function avatarColor(n){let h=0;for(let i=0;i<(n||"").length;i++)h=(h*31+n.charCodeAt(i))%AVCOLORS.length;return AVCOLORS[h]}

const DEFAULT = [
  {id:genId(),title:"Weekly view",column:"open",priority:"Low",assignee:"Alice"},
  {id:genId(),title:"Card view",column:"open",priority:"Medium",assignee:""},
  {id:genId(),title:"Bug fix",column:"open",priority:"High",assignee:"Bob"},
  {id:genId(),title:"Monthly view",column:"inprogress",priority:"Medium",assignee:"Charlie"},
  {id:genId(),title:"Main page update",column:"inprogress",priority:"High",assignee:"Alice"},
  {id:genId(),title:"Dashboard",column:"hold",priority:"Low",assignee:""},
  {id:genId(),title:"Monthly newsletter",column:"completed",priority:"High",assignee:"Bob"},
  {id:genId(),title:"Testimonials",column:"completed",priority:"Low",assignee:"Charlie"},
];

let cards = [];
let dragId = null;
let addingTo = null;
let editCardId = null;
let openMenu = null;

function init() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    cards = raw ? JSON.parse(raw) : DEFAULT;
  } catch (e) { cards = DEFAULT; }
  render();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cards)); } catch (e) {}
}

function render() {
  const board = document.getElementById("board");
  board.innerHTML = "";
  COLUMNS.forEach(col => {
    const colCards = cards.filter(c => c.column === col.id);
    const div = document.createElement("div");
    div.className = "col";
    div.dataset.col = col.id;
    div.innerHTML = `
      <div class="col-header">
        <span class="col-label">${col.label}</span>
        <span class="col-count">${colCards.length}</span>
      </div>
      <div class="cards" id="cards-${col.id}"></div>
      <div id="adder-${col.id}"></div>
    `;
    div.addEventListener("dragover", e => { e.preventDefault(); div.classList.add("over"); });
    div.addEventListener("dragleave", e => { if(!div.contains(e.relatedTarget)) div.classList.remove("over"); });
    div.addEventListener("drop", e => {
      e.preventDefault();
      div.classList.remove("over");
      if(dragId) { cards = cards.map(c => c.id===dragId ? {...c, column: col.id} : c); dragId=null; save(); render(); }
    });
    board.appendChild(div);

    const cardsDiv = div.querySelector(`#cards-${col.id}`);
    colCards.forEach(card => {
      const ps = PSTYLE[card.priority] || PSTYLE.Medium;
      const cardEl = document.createElement("div");
      cardEl.className = "card" + (dragId===card.id?" dragging":"");
      cardEl.draggable = true;
      cardEl.innerHTML = `
        <div class="card-top">
          <span class="card-title">${esc(card.title)}</span>
          <div class="menu-wrap" id="menu-${card.id}">
            <button class="menu-btn" data-cardid="${card.id}">···</button>
            ${openMenu===card.id ? `<div class="dropdown">
              <button class="drop-btn" style="color:var(--color-text-primary)" data-edit="${card.id}">✏️ Edit</button>
              <button class="drop-btn" style="color:#d32f2f" data-delete="${card.id}">🗑️ Delete</button>
            </div>` : ""}
          </div>
        </div>
        <div class="card-bottom">
          <span class="badge" style="background:${ps.bg};color:${ps.color}">
            <span class="badge-dot" style="background:${ps.dot}"></span>${esc(card.priority||"Medium")}
          </span>
          ${card.assignee
            ? `<div class="avatar" style="background:${avatarColor(card.assignee)}" title="${esc(card.assignee)}">${esc(avatarInitials(card.assignee))}</div>`
            : `<div class="avatar avatar-empty">👤</div>`}
        </div>
        ${card.assignee ? `<div class="assignee-name">${esc(card.assignee)}</div>` : ""}
      `;
      cardEl.addEventListener("dragstart", e => { dragId=card.id; e.dataTransfer.effectAllowed="move"; setTimeout(()=>cardEl.classList.add("dragging"),0); });
      cardEl.addEventListener("dragend", () => { dragId=null; cardEl.classList.remove("dragging"); });
      cardEl.querySelector(".menu-btn").addEventListener("click", e => {
        e.stopPropagation(); openMenu = openMenu===card.id ? null : card.id; render();
      });
      const editBtn = cardEl.querySelector(`[data-edit="${card.id}"]`);
      if(editBtn) editBtn.addEventListener("click", e => { e.stopPropagation(); openMenu=null; editCardId=card.id; render(); });
      const delBtn = cardEl.querySelector(`[data-delete="${card.id}"]`);
      if(delBtn) delBtn.addEventListener("click", e => { e.stopPropagation(); openMenu=null; cards=cards.filter(c=>c.id!==card.id); save(); render(); });
      cardsDiv.appendChild(cardEl);
    });

    const adder = div.querySelector(`#adder-${col.id}`);
    if(addingTo === col.id) {
      adder.appendChild(buildForm({priority:"Medium"}, d => { cards=[...cards,{id:genId(),column:col.id,...d}]; addingTo=null; save(); render(); }, ()=>{ addingTo=null; render(); }, "Add card"));
    } else {
      const btn = document.createElement("button");
      btn.className = "add-btn";
      btn.innerHTML = `<span style="font-size:16px">+</span> Add a card`;
      btn.addEventListener("click", () => { addingTo=col.id; render(); });
      adder.appendChild(btn);
    }
  });

  document.addEventListener("click", () => { if(openMenu){openMenu=null;render();} }, {once:true});

  renderModal();
}

function buildForm(initial, onSave, onCancel, saveLabel) {
  const wrap = document.createElement("div");
  wrap.className = "form";
  let selPriority = initial.priority || "Medium";
  wrap.innerHTML = `
    <input type="text" class="form-title-input" placeholder="Card title…" value="${esc(initial.title||"")}">
    <div>
      <div class="form-label">PRIORITY</div>
      <div class="prio-btns" id="prio-btns"></div>
    </div>
    <div>
      <div class="form-label">ASSIGNED TO</div>
      <input type="text" class="form-assignee-input" placeholder="Name (optional)" value="${esc(initial.assignee||"")}">
    </div>
    <div class="form-actions">
      <button class="save-btn">${esc(saveLabel||"Save")}</button>
      <button class="cancel-btn">✕</button>
    </div>
  `;
  const prioBtns = wrap.querySelector("#prio-btns");
  function updatePrioStyles() {
    PRIORITIES.forEach((pp, i) => {
      const btn = prioBtns.children[i];
      const ss = PSTYLE[pp];
      if(pp===selPriority) {
        btn.style.background=ss.bg; btn.style.color=ss.color; btn.style.borderColor=ss.dot; btn.style.fontWeight="600";
      } else {
        btn.style.background=""; btn.style.color=""; btn.style.borderColor=""; btn.style.fontWeight="400";
      }
    });
  }
  PRIORITIES.forEach(p => {
    const b = document.createElement("button");
    b.className = "prio-btn";
    b.textContent = p;
    b.addEventListener("click", () => { selPriority=p; updatePrioStyles(); });
    prioBtns.appendChild(b);
  });
  setTimeout(() => {
    updatePrioStyles();
    wrap.querySelector(".form-title-input").focus();
  }, 0);
  wrap.querySelector(".save-btn").addEventListener("click", () => {
    const title = wrap.querySelector(".form-title-input").value.trim();
    if(!title) return;
    onSave({title, priority:selPriority, assignee:wrap.querySelector(".form-assignee-input").value.trim()});
  });
  wrap.querySelector(".cancel-btn").addEventListener("click", onCancel);
  wrap.querySelector(".form-title-input").addEventListener("keydown", e => {
    if(e.key==="Enter") wrap.querySelector(".save-btn").click();
    if(e.key==="Escape") onCancel();
  });
  return wrap;
}

function renderModal() {
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  if(!editCardId) return;
  const card = cards.find(c=>c.id===editCardId);
  if(!card) return;
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.addEventListener("click", () => { editCardId=null; render(); });
  const modal = document.createElement("div");
  modal.className = "modal";
  modal.addEventListener("click", e => e.stopPropagation());
  const title = document.createElement("div");
  title.className = "modal-title";
  title.textContent = "Edit card";
  modal.appendChild(title);
  modal.appendChild(buildForm(card, d => {
    cards = cards.map(c=>c.id===editCardId?{...c,...d}:c);
    editCardId=null; save(); render();
  }, ()=>{editCardId=null;render();}, "Save changes"));
  backdrop.appendChild(modal);
  root.appendChild(backdrop);
}

init();
</script>
</body>
</html>
